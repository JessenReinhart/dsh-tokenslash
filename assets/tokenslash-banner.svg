<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="420" viewBox="0 0 1440 420" role="img" aria-labelledby="title desc">
  <title id="title">TokenSlash</title>
  <desc id="desc">TokenSlash is context control for DeepSeek Harness. A sharp lime slash cuts through a stack of prompt tokens.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#52615c" stroke-opacity=".14" stroke-width="1"/>
    </pattern>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141d1a"/>
      <stop offset="1" stop-color="#0d1412"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="420" rx="28" fill="#0b100f"/>
  <rect width="1440" height="420" rx="28" fill="url(#grid)"/>
  <path d="M0 340H1440" stroke="#35433d" stroke-opacity=".42"/>
  <path d="M1030 0V420" stroke="#35433d" stroke-opacity=".25" stroke-dasharray="4 9"/>
  <g transform="translate(78 84)">
    <rect width="252" height="252" rx="54" fill="url(#panel)" stroke="#34443d" stroke-width="2"/>
    <rect x="30" y="51" width="178" height="18" rx="9" fill="#56645e"/>
    <rect x="30" y="88" width="146" height="18" rx="9" fill="#748078"/>
    <rect x="30" y="125" width="166" height="18" rx="9" fill="#56645e"/>
    <rect x="30" y="162" width="120" height="18" rx="9" fill="#748078"/>
    <rect x="30" y="199" width="154" height="18" rx="9" fill="#56645e"/>
    <path d="M184 30L84 224" fill="none" stroke="#c8f36b" stroke-width="19" stroke-linecap="round"/>
    <path d="M183 30L84 224" fill="none" stroke="#f0ffbf" stroke-opacity=".55" stroke-width="3" stroke-linecap="round"/>
    <rect x="154" y="91" width="34" height="12" rx="6" fill="#c8f36b"/>
    <rect x="133" y="128" width="21" height="12" rx="6" fill="#c8f36b"/>
    <rect x="113" y="165" width="15" height="12" rx="6" fill="#c8f36b"/>
  </g>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="390" y="121" fill="#aab8ad" font-size="17" font-weight="700" letter-spacing="4">CONTEXT CONTROL FOR DEEPSEEK HARNESS</text>
    <text x="382" y="231" fill="#f0f4ed" font-size="91" font-weight="800" letter-spacing="-5">TOKEN</text>
    <text x="681" y="231" fill="#c8f36b" font-size="91" font-weight="800" letter-spacing="-5">SLASH</text>
    <rect x="390" y="266" width="62" height="5" rx="2.5" fill="#c8f36b"/>
    <text x="390" y="316" fill="#d5ddd5" font-size="24" font-weight="600" letter-spacing="1.1">LESS PROMPT OVERHEAD.</text>
    <text x="390" y="350" fill="#d5ddd5" font-size="24" font-weight="600" letter-spacing="1.1">MORE ROOM FOR THE WORK.</text>
  </g>
  <g transform="translate(1090 111)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="0" y="0" fill="#91a097" font-size="12" letter-spacing="2.6">TASK-AWARE CONTEXT</text>
    <g transform="translate(0 31)">
      <rect width="250" height="70" rx="12" fill="#141e1a" stroke="#35443d"/>
      <text x="17" y="24" fill="#899990" font-size="10" letter-spacing="1.4">AVAILABLE TOOLS</text>
      <g fill="#66756c">
        <rect x="17" y="39" width="32" height="13" rx="4"/>
        <rect x="55" y="39" width="50" height="13" rx="4"/>
        <rect x="111" y="39" width="27" height="13" rx="4"/>
        <rect x="144" y="39" width="43" height="13" rx="4"/>
        <rect x="193" y="39" width="40" height="13" rx="4"/>
      </g>
    </g>
    <path d="M125 112V136" stroke="#c8f36b" stroke-width="2" stroke-linecap="round"/>
    <path d="M118 129L125 137L132 129" fill="none" stroke="#c8f36b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(0 148)">
      <rect width="250" height="92" rx="12" fill="#141e1a" stroke="#c8f36b" stroke-opacity=".65"/>
      <text x="17" y="24" fill="#c8f36b" font-size="10" letter-spacing="1.4">ACTIVE CONTEXT</text>
      <rect x="17" y="40" width="62" height="13" rx="4" fill="#c8f36b"/>
      <rect x="85" y="40" width="40" height="13" rx="4" fill="#91a097"/>
      <rect x="131" y="40" width="83" height="13" rx="4" fill="#91a097"/>
      <text x="17" y="75" fill="#91a097" font-size="10" letter-spacing="1">ONLY WHAT THE TASK NEEDS</text>
    </g>
  </g>
  <text x="1390" y="393" fill="#64736a" font-family="ui-monospace, monospace" font-size="11" text-anchor="end" letter-spacing="1.5">DSH / CORDIS PLUGIN</text>
